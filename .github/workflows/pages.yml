name: pages
# Pages is not enabled yet. After enabling (Settings > Pages > Source: GitHub Actions),
# add a push trigger: push: {branches: [main], paths: ["site/**", "data/**"]}
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r site/* _site/ && mkdir _site/data && cp data/*.csv data/datapackage.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: d
        uses: actions/deploy-pages@v4
